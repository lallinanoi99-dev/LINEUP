  <script>
    // Base path: "/" on a custom domain, "/<repo>/" on <user>.github.io/<repo>/.
    // Also restores deep links redirected here by 404.html (GitHub Pages SPA trick).
    (function () {
      var base = "/";
      if (/\.github\.io$/.test(location.hostname)) {
        var seg = location.pathname.split("/")[1];
        if (seg) base = "/" + seg + "/";
      }
      document.write('<base href="' + base + '">');
      var p = new URLSearchParams(location.search).get("p");
      if (p) history.replaceState(null, "", base.replace(/\/$/, "") + decodeURIComponent(p));
    })();
  </script>
